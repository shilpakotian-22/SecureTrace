{% extends "dashboard_layout.html" %}

{% block title %}
Settings
{% endblock %}

{% block dashboard_content %}

<div class="card shadow">

    <div class="card-body">

        <h3 class="mb-4">
            ⚙ Application Settings
        </h3>

        <form method="POST">

            <div class="mb-3">

                <label>Application Name</label>

                <input
                    type="text"
                    name="application_name"
                    class="form-control"
                    value="{{ settings.application_name }}">

            </div>

            <div class="mb-3">

                <label>Organization</label>

                <input
                    type="text"
                    name="organization"
                    class="form-control"
                    value="{{ settings.organization }}">

            </div>

            <div class="mb-3">

                <label>Default Sender Email</label>

                <input
                    type="email"
                    name="default_sender"
                    class="form-control"
                    value="{{ settings.default_sender }}">

            </div>

            <div class="mb-3">

                <label>Timezone</label>

                <input
                    type="text"
                    name="timezone"
                    class="form-control"
                    value="{{ settings.timezone }}">

            </div>

            <div class="mb-3">

                <label>Maximum Upload Size (MB)</label>

                <input
                    type="number"
                    name="max_upload_size"
                    class="form-control"
                    value="{{ settings.max_upload_size }}">

            </div>

            <button class="btn btn-primary">

                Save Settings

            </button>

        </form>

    </div>

</div>

{% endblock %}
